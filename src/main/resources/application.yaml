server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users
              uri: ${USERS_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**

            - id: fidelity
              uri: ${FIDELITY_URL:http://localhost:8082}
              predicates:
                - Path=/api/fidelity/**

            - id: statistiques
              uri: ${STATISTIQUES_URL:http://localhost:8083}
              predicates:
                - Path=/api/statistiques/**

            - id: commande
              uri: ${COMMANDE_URL:http://localhost:8084}
              predicates:
                - Path=/api/commande/**

            - id: catalogue
              uri: ${CATALOGUE_URL:http://localhost:8085}
              predicates:
                - Path=/api/catalogue/**

            - id: front
              uri: ${FRONT_URL:http://localhost:3000}
              predicates:
                - Path=/**

          # CORS : utile seulement en dev, quand le front tourne avec `npm run dev`
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


